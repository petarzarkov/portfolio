name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# A PR run is superseded by its own next push. `main` is never cancelled: a run
# there can reach the deploy step.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every gate is a phase of `scripts/ci.ts`, invoked as `bun run ci <phase>`, so
# `bun run ci` locally runs exactly what these jobs run. When a gate changes it
# changes in that one file, rather than drifting between here and the scripts.
jobs:
  static:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run ci static

  unit:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run ci unit

  deploy:
    name: Deploy
    needs: [static, unit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build
        run: bun run ci build
        env:
          VITE_SERVICE_ID: ${{ secrets.VITE_SERVICE_ID }}
          VITE_USER_ID: ${{ secrets.VITE_USER_ID }}
          VITE_TEMPLATE_ID: ${{ secrets.VITE_TEMPLATE_ID }}

      # `--branch` is what separates a preview from production: Cloudflare treats
      # the project's production branch as production and gives every other
      # branch a `<hash>.<project>.pages.dev` preview URL, so one command covers
      # both cases.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=portfolio
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Summarise
        run: |
          echo "Deployed ${{ github.head_ref || github.ref_name }} to" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.deploy.outputs.deployment-url }}" >> $GITHUB_STEP_SUMMARY
