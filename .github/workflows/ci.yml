name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# A PR run is superseded by its own next push. `main` is never cancelled: a run
# there can reach the deploy step.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every gate is a phase of `scripts/ci.ts`, invoked as `bun run ci <phase>`, so
# `bun run ci` locally runs exactly what these jobs run. When a gate changes it
# changes in that one file, rather than drifting between here and the scripts.
jobs:
  static:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run ci static

  unit:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run ci unit

  browser:
    name: Site in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # No browser download step: Bun.WebView drives the Chrome the runner image
      # already ships.
      - run: bun run ci build
      - run: bun run ci browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-shots
          path: browser/.shots/
          retention-days: 7

  deploy:
    name: Deploy
    needs: [static, unit, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      # Only so the preview comment below can be written as github-actions[bot].
      pull-requests: write
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # No build secrets. The contact form and EmailJS are gone, and the
      # project data is a committed snapshot rather than a build-time fetch -
      # so a build needs nothing but the repository.
      - name: Build
        run: bun run ci build

      # `--branch` is what separates a preview from production: Cloudflare treats
      # the project's production branch as production and gives every other
      # branch a `<hash>.<project>.pages.dev` preview URL, so one command covers
      # both cases.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=portfolio
            --branch=${{ github.head_ref || github.ref_name }}

      # One comment per pull request, rewritten in place rather than appended:
      # a fresh comment on every push buries the conversation under a stack of
      # near-identical links. The marker is how the next run finds the comment
      # it left last time. Skipped on `main`, which has no PR to comment on.
      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        # Pinned to a commit, alone among the actions here, because it is the
        # only step that runs with write access to the repository: a moving
        # tag would be a moving tag holding `pull-requests: write`. The rest
        # are read-only and stay on their major.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # The alias follows the branch and survives the next push, so it is
          # the one worth clicking twice; the deployment URL is immutable and
          # pins the exact build, so it is the one worth citing. Wrangler only
          # emits an alias from 3.78 on, hence the fallback.
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const MARKER = '<!-- cloudflare-preview -->';
            const { ALIAS_URL, DEPLOY_URL } = process.env;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);

            const body = [
              MARKER,
              '### Preview',
              '',
              `**${ALIAS_URL || DEPLOY_URL}**`,
              '',
              `\`${sha}\` \u00b7 [this exact build](${DEPLOY_URL})`,
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...context.repo, issue_number: context.issue.number },
            );
            const mine = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith(MARKER),
            );

            await (mine
              ? github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: mine.id,
                  body,
                })
              : github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: context.issue.number,
                  body,
                }));

      - name: Summarise
        run: |
          echo "Deployed ${{ github.head_ref || github.ref_name }} to" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.deploy.outputs.deployment-url }}" >> $GITHUB_STEP_SUMMARY
