name: Refresh data

# The site's project list, language totals and activity come from a committed
# snapshot under src/generated. This is what keeps
# that snapshot current without anyone touching the repo: tag a repo
# `portfolio` on github.com and it appears here within a day.
on:
  schedule:
    # Daily, off the hour - the hour is the busiest slot on shared runners.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # Only to dispatch ci.yml once the snapshot has moved - see the note there.
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate and commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # A fine-grained PAT, not GITHUB_TOKEN: the default job token cannot read
      # `viewer.contributionsCollection` and cannot see private repos, which are
      # the denominator the language totals are measured against.
      - name: Generate
        run: bun run gen
        env:
          GH_DATA_TOKEN: ${{ secrets.GH_DATA_TOKEN }}

      # A refresh that never reaches production did nothing, and this push
      # cannot deploy itself: a push authenticated with GITHUB_TOKEN starts no
      # workflow run, which is how GitHub stops a workflow retriggering itself
      # forever. So ci.yml never sees this commit on its own. `workflow_dispatch`
      # is the documented exception to that rule, so the deploy is asked for by
      # name. The alternative - pushing with a PAT, so the push event itself
      # counts - buys the same run at the price of a second credential to
      # rotate.
      - name: Commit and deploy when the snapshot moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/generated
          if git diff --cached --quiet; then
            echo "snapshot unchanged" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          git commit -m "chore(data): refresh generated snapshot"
          git push
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
          echo "snapshot updated, deploy dispatched" >> $GITHUB_STEP_SUMMARY
